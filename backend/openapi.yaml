openapi: 3.1.0
info:
  title: Notes API
  version: "1.0.0"
  description: API for managing notes.

servers:
  - url: http://localhost:3000

paths:
  /notes:
    get:
      summary: List all notes
      operationId: listNotes
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotesResponse'

    post:
      summary: Create a new note
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNote'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteIdParam'

    get:
      summary: Get a note by ID
      operationId: getNote
      responses:
        '200':
          description: Note retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          description: Note not found

    patch:
      summary: Update a note by ID
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNote'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          description: Note not found

    delete:
      summary: Delete a note by ID
      operationId: deleteNote
      responses:
        '204':
          description: Note deleted successfully
        '404':
          description: Note not found

  /notes/{noteId}/archive:
    parameters:
      - $ref: '#/components/parameters/NoteIdParam'
    patch:
      summary: Archive or unarchive a note
      operationId: setNoteArchivedState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveNoteRequest'
      responses:
        '200':
          description: Note archived/unarchived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          description: Note not found

components:
  parameters:
    NoteIdParam:
      name: noteId
      in: path
      required: true
      description: Unique identifier of the note.
      schema:
        type: integer

  schemas:
    Note:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        archived:
          type: boolean
          default: false
      required:
        - id
        - content
        - archived

    ListNotesResponse:
      type: array
      items:
        $ref: '#/components/schemas/Note'

    NewNote:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
      required:
        - content

    UpdateNote:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
      required:
        - content

    ArchiveNoteRequest:
      type: object
      required:
        - archived
      properties:
        archived:
          type: boolean
          example: true